name: Barrr

options:
  bundleIdPrefix: com.chenshenyi
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  # 根目錄 Package.swift：每個功能的純物件 module（BarrrCore、NoSleepCore）
  BarrrModules:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    # 每個檔案只能使用自己 import 的模組成員，import 不會跨檔案外漏
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
    # 沒有開發者帳號：ad-hoc 簽章（Sign to Run Locally），自己 build 的 App 沒有隔離標記，可以直接執行
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: NO
    STRING_CATALOG_GENERATE_SYMBOLS: YES

targets:
  Barrr:
    type: application
    platform: macOS
    sources:
      - Targets/App/Barrr
      - Targets/App/Resources
    dependencies:
      - package: BarrrModules
        product: BarrrCore
      - package: BarrrModules
        product: NoSleepCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chenshenyi.Barrr
        PRODUCT_NAME: Barrr
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Barrr
        # 只有選單列圖示與管理視窗，沒有 Dock 圖示與選單列的 App 選單
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
